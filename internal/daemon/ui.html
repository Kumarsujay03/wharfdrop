<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wharfdrop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d9488'/%3E%3Cpath d='M11 9v14m0 0-4-4m4 4 4-4M21 23V9m0 0-4 4m4-4 4 4' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  /* Wharfdrop palette: neutral zinc surfaces, deep-teal accent, cyan highlight */
  --bg:#f7f7f8;--surface:#ffffff;--surface-2:#f3f4f5;--hover:#eef0f1;--border:#e4e4e7;--border-strong:#d4d4d8;
  --text:#18181b;--muted:#63636e;--faint:#9a9aa5;
  --accent:#0f766e;--accent-2:#0891b2;--accent-fg:#ffffff;--accent-soft:rgba(13,148,136,.10);--accent-ring:rgba(13,148,136,.28);
  --grad:linear-gradient(135deg,#0d9488 0%,#0891b2 100%);
  --glow:radial-gradient(1200px 420px at 0% 0%,rgba(20,184,166,.07),transparent 60%);
  --ok:#16a34a;--ok-soft:rgba(22,163,74,.11);--warn:#c2410c;--warn-soft:rgba(234,88,12,.11);
  --danger:#dc2626;--danger-soft:rgba(220,38,38,.09);
  --shadow:0 1px 2px rgba(24,24,27,.05),0 1px 1px rgba(24,24,27,.03);--shadow-lg:0 24px 60px rgba(24,24,27,.18);
  --scrim:rgba(9,9,11,.45);
  --r:14px;--r-sm:9px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#09090b;--surface:#111113;--surface-2:#18181b;--hover:#1f1f23;--border:#232327;--border-strong:#303036;
  --text:#f4f4f5;--muted:#a1a1aa;--faint:#6b6b75;
  --accent:#2dd4bf;--accent-2:#22d3ee;--accent-fg:#042f2e;--accent-soft:rgba(45,212,191,.12);--accent-ring:rgba(45,212,191,.30);
  --grad:linear-gradient(135deg,#2dd4bf 0%,#22d3ee 100%);
  --glow:radial-gradient(1200px 460px at 0% 0%,rgba(45,212,191,.07),transparent 60%);
  --ok:#4ade80;--ok-soft:rgba(74,222,128,.12);--warn:#fb923c;--warn-soft:rgba(251,146,60,.13);
  --danger:#f87171;--danger-soft:rgba(248,113,113,.12);
  --shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 28px 70px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
.i{width:17px;height:17px;flex:none}
.i-lg{width:24px;height:24px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--grad);border-color:transparent;color:var(--accent-fg);box-shadow:0 2px 10px var(--accent-ring)}
.btn.primary:hover{filter:brightness(1.06);background:var(--grad)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft);border-color:transparent}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:34px;padding:0 12px;font-size:14px}
.btn.icon{width:40px;padding:0}.btn.icon.sm{width:34px}
.input{height:42px;padding:0 13px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);min-width:0;width:100%}
.input:focus,select.input:focus{outline:3px solid var(--accent-ring);outline-offset:0;border-color:var(--accent)}
select.input{padding-right:8px}
label.field{display:flex;flex-direction:column;gap:7px;font-size:13.5px;font-weight:500;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.accent{background:var(--accent-soft);color:var(--accent)}

/* top bar */
.top{height:64px;flex:none;display:flex;align-items:center;gap:16px;padding:0 22px;border-bottom:1px solid var(--border);background:var(--surface)}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad) !important;color:var(--accent-fg) !important;box-shadow:0 4px 14px var(--accent-ring);background:var(--accent);display:grid;place-items:center;color:#fff}
.me{display:flex;align-items:center;gap:9px;padding:7px 14px 7px 12px;border-radius:999px;background:var(--surface-2);font-size:13.5px;color:var(--muted);min-width:0}
.me b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.top .spacer{flex:1}
.top>*{flex-shrink:0}.top .me{flex-shrink:1}

/* shell */
.shell{flex:1;display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0}
.side{border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.side-scroll{flex:1;overflow:auto;padding:20px 14px}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:0 10px;margin:4px 0 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.dev{display:flex;align-items:center;gap:12px;width:100%;padding:11px 10px;margin-bottom:3px;border-radius:var(--r-sm);border:0;background:transparent;text-align:left;cursor:pointer}
.dev:hover{background:var(--hover)}
.dev.sel{background:var(--accent-soft)}
.dev .meta{flex:1;min-width:0}
.dev .name{font-weight:550;display:flex;align-items:center;gap:6px}
.dev .sub{font-size:13px;color:var(--muted)}
.avatar{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:650;font-size:15px;color:#fff;flex:none;position:relative}
.av-img{position:absolute;inset:0;width:100%;height:100%;border-radius:inherit;object-fit:cover}
.me .avatar{width:24px;height:24px;border-radius:50%;font-size:10px;margin-left:-4px}
.avatar .st{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:50%;border:2px solid var(--surface);background:var(--faint)}
.avatar .st.on{background:var(--ok)}
.side-empty{padding:10px 10px 16px;font-size:14px;display:flex;gap:8px;align-items:center;color:var(--muted)}
.nav{border-top:1px solid var(--border);padding:12px 14px 16px;display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border:0;background:transparent;border-radius:var(--r-sm);cursor:pointer;color:var(--muted);font-weight:500;text-align:left}
.nav button:hover{background:var(--hover);color:var(--text)}
.nav button.sel{background:var(--accent-soft);color:var(--accent)}
.nav .count{margin-left:auto}
.mini-progress{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin:2px 10px 4px}
.mini-speed{display:flex;align-items:center;gap:6px;margin:0 12px 6px;font-size:12.5px;color:var(--accent);font-variant-numeric:tabular-nums}
.mini-speed .i{width:13px;height:13px}
.mini-progress i{display:block;height:100%;background:var(--grad);transition:width .4s}

/* main */
.main{overflow:auto;min-width:0;min-height:0;background:var(--glow)}
.page{max-width:1120px;margin:0 auto;padding:clamp(18px,3.4vh,34px) clamp(16px,3vw,40px) clamp(20px,4vh,48px)}
.page-h{display:flex;align-items:center;gap:18px;margin-bottom:clamp(14px,2.6vh,26px)}
.page-h h1{font-size:24px;line-height:1.25;font-weight:650;letter-spacing:-.015em}
.page-h .avatar{width:58px;height:58px;border-radius:16px;font-size:21px}
.page-h .grow{flex:1;min-width:0}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:22px}
.tab{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 16px;font-size:15px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:550;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.sel{color:var(--accent);border-bottom-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card + .card{margin-top:0}
.card-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);min-height:62px}
.card-b{padding:20px}

/* breadcrumbs + file table */
.crumbs{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow:hidden;font-weight:550}
.crumbs button{border:0;background:none;padding:6px 8px;font-size:15px;border-radius:6px;cursor:pointer;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs button:hover{background:var(--hover);color:var(--text)}
.crumbs button:last-child{color:var(--text)}
.crumbs .sep{color:var(--faint);flex:none}
.up-btn{display:none !important}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) 100px 130px 46px;align-items:center;gap:12px;padding:0 14px 0 18px;height:56px;border-top:1px solid var(--border)}
.rows .row:first-child{border-top:0}
.row.head{height:40px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);background:var(--surface-2);border-top:0}
.row.click{cursor:pointer}
.row.click:hover,.row.file:hover{background:var(--hover)}
.row .num{text-align:right;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.row.head .num{font-size:inherit;color:inherit}
.row .act{opacity:.55;display:flex;justify-content:flex-end;transition:opacity .12s}
.row:hover .act,.row .act:focus-within{opacity:1}
.ficon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.ficon.folder{background:var(--accent-soft);color:var(--accent)}
.share-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding:18px}
.share-tile{display:flex;align-items:center;gap:14px;padding:18px;transition:border-color .12s,background .12s;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.share-tile:hover{border-color:var(--accent);background:var(--accent-soft)}
.share-tile .ficon{width:46px;height:46px;border-radius:12px}

/* empty states */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:56px 24px;color:var(--muted)}
.empty .big{width:64px;height:64px;border-radius:18px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);margin-bottom:6px}
.empty h3{font-size:18px;color:var(--text);font-weight:600}
.empty p{max-width:460px;font-size:14.5px}

/* send */
.drop{display:flex;flex-direction:column;align-items:center;gap:12px;padding:clamp(24px,6.5vh,64px) 24px;border:2px dashed var(--border-strong);border-radius:var(--r);text-align:center;color:var(--muted);transition:.15s;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.drop .big{width:72px;height:72px;border-radius:20px;background:var(--grad);color:var(--accent-fg);box-shadow:0 8px 24px var(--accent-ring);display:grid;place-items:center}
.drop h3{font-size:19px;color:var(--text);font-weight:600}
.drop .acts{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.upbar{margin-top:12px}
.overlay{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(3px);display:none;place-items:center;z-index:40;pointer-events:none}
.overlay.on{display:grid}
.overlay div{padding:28px 36px;border-radius:16px;background:var(--surface);border:2px dashed var(--accent);font-size:16px;font-weight:600;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-lg)}

/* transfers */
.tr{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--border)}
.rows .tr:first-child{border-top:0}
.tr .nm{font-weight:550}
.tr .info{font-size:13.5px;color:var(--muted);margin-top:1px}
.tr .live{color:var(--accent);font-weight:600}
.recent .tr{grid-template-columns:40px minmax(0,1fr);row-gap:6px}
.recent .tr .right{grid-column:2;justify-content:flex-start;flex-wrap:wrap;font-size:13px}
.tr .right{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--grad);transition:width .4s}
.bar i.done{background:var(--ok)}.bar i.err{background:var(--danger)}
.upcard{display:flex;flex-direction:column;gap:10px}
.uprow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;min-width:0}
.upstats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.upstats .live{color:var(--accent);font-weight:600}
.bar.big{height:8px;margin-top:0}
.dir{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.dir.in{background:var(--ok-soft);color:var(--ok)}.dir.out{background:var(--accent-soft);color:var(--accent)}.dir.err{background:var(--danger-soft);color:var(--danger)}

/* forms / settings */
.grid-form{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) minmax(0,200px) auto;gap:14px;align-items:end}
.set{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;padding:24px;border-top:1px solid var(--border)}
.set:first-child{border-top:0}
.set h4{font-size:15.5px;font-weight:600}
.set p{font-size:13.5px;color:var(--muted);margin-top:3px}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:11px;background:var(--surface-2);gap:2px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:550;font-size:14px}
.seg button.sel{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.idrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.idrow form{flex:1;min-width:220px;flex-wrap:nowrap}
.avset{display:flex;align-items:center;gap:12px}
.avbtns{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.avset .avatar.big{width:60px;height:60px;border-radius:50%;font-size:21px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px 14px;font-size:14px}
.kv dt{color:var(--muted)}

/* pairing / dialogs */
.modal{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .12s}
.dialog{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-lg);padding:28px}
.dialog h2{font-size:20px;font-weight:650;margin:14px 0 6px}
.dialog p{color:var(--muted);font-size:14.5px}
.dialog .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:26px}
.dialog .ico{width:50px;height:50px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.code{display:flex;justify-content:center;gap:8px;margin:18px 0 6px}
.code span{width:50px;height:62px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;font:650 30px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes fade{from{opacity:0}}
/* grid view + viewer */
.vtoggle{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface-2);gap:2px}
.vtoggle button{width:34px;height:30px;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.vtoggle button.sel{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.gridv{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;padding:18px}
.gtile{display:flex;flex-direction:column;gap:8px;padding:8px 8px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;min-width:0;transition:border-color .12s,background .12s,transform .12s}
.gtile:hover{border-color:var(--accent);background:var(--accent-soft)}
.gthumb{position:relative;aspect-ratio:4/3;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;color:var(--muted)}
.gthumb .i{width:34px;height:34px;stroke-width:1.6}
.gthumb.folder{background:var(--accent-soft);color:var(--accent)}
.gthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gthumb .play{position:absolute;right:8px;bottom:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.gthumb .play .i{width:14px;height:14px}
.gtile .gname{font-weight:550;font-size:14px;padding:0 4px}
.gtile .gmeta{font-size:12.5px;color:var(--muted);padding:0 4px;margin-top:-6px}
.row.file{cursor:pointer}
.viewer{position:fixed;inset:0;z-index:55;background:rgba(5,6,8,.92);backdrop-filter:blur(6px);display:flex;flex-direction:column;animation:fade .12s;color:#f4f4f5}
.vbar{display:flex;align-items:center;gap:12px;padding:14px 18px;min-height:64px}
.vbar .vname{font-weight:600;font-size:16px;flex:1;min-width:0}
.vbar .vmeta{color:#a1a1aa;font-size:13.5px;white-space:nowrap}
.vbar .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);color:#f4f4f5}
.vbar .btn:hover{background:rgba(255,255,255,.16)}
.vstage{flex:1;min-height:0;display:grid;grid-template-columns:64px minmax(0,1fr) 64px;align-items:center;padding:0 8px 24px}
.vnav{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;display:grid;place-items:center;cursor:pointer;justify-self:center}
.vnav:hover{background:rgba(255,255,255,.16)}.vnav:disabled{opacity:.25;cursor:default}
.vmedia{height:100%;display:grid;place-items:center;min-width:0;min-height:0}
.vmedia img,.vmedia video{max-width:100%;max-height:calc(100vh - 110px);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6);background:#000}
.vmedia audio{width:min(520px,90%)}
.vmedia iframe{width:min(1000px,100%);height:calc(100vh - 110px);border:0;border-radius:10px;background:#fff}
.vmedia pre{width:min(1000px,100%);max-height:calc(100vh - 110px);overflow:auto;margin:0;padding:20px 22px;border-radius:12px;background:#111113;border:1px solid rgba(255,255,255,.1);font:13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;color:#e4e4e7}
.vnone{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;color:#a1a1aa}
.vnone .big{width:72px;height:72px;border-radius:20px;background:rgba(255,255,255,.07);display:grid;place-items:center;color:#e4e4e7}
.vnone h3{color:#f4f4f5;font-size:18px}
@media (max-width:720px){ .vstage{grid-template-columns:44px minmax(0,1fr) 44px;padding:0 0 16px} .vnav{width:38px;height:38px} .gridv{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:12px} .vbar .vmeta{display:none} }

<body>
<header class="top">
  <div class="brand"><span class="logo" id="logo"></span><span class="brand-txt">Wharfdrop</span></div>
  <div class="me" id="me"></div>
  <div class="spacer"></div>
  <div id="updpill"></div>
  <button class="btn sm danger" data-act="stop" title="Stop Wharfdrop completely">
    <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg><span class="stop-txt">Stop</span>
  </button>
</header>
<div class="shell" id="shell">
  <aside class="side">
    <div class="side-scroll">
      <div class="side-h">Devices <button class="btn ghost icon sm" data-act="addip" title="Add a device by IP address" id="addbtn"></button></div>
      <div id="devlist"></div>
      <div id="nearby"></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="overlay" id="overlay"><div id="overlaytext"></div></div>
<div id="modal"></div>
<div id="viewer"></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="fi" multiple hidden>
<input type="file" id="di" webkitdirectory hidden>
<input type="file" id="avin" accept="image/png,image/jpeg,image/gif" hidden>

<script>
"use strict";
const T = new URLSearchParams(location.search).get('t') || '';
const $ = s => document.querySelector(s);

// ---------- icons (Lucide-style, inline so the app works offline) ----------
const P = {
  laptop:'<path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55A1 1 0 0 1 20.39 20H3.61a1 1 0 0 1-.89-1.45L4 16"/>',
  folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  folderOpen:'<path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/>',
  file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
  image:'<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
  video:'<path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/>',
  music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  archive:'<rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>',
  doc:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',
  send:'<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>',
  share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/>',
  arrows:'<path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/>',
  sliders:'<line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  chev:'<path d="m9 18 6-6-6-6"/>',
  shield:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
  wifi:'<path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  alert:'<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
  sparkle:'<path d="M12 3v3"/><path d="M12 18v3"/><path d="m4.9 4.9 2.1 2.1"/><path d="m17 17 2.1 2.1"/><path d="M3 12h3"/><path d="M18 12h3"/><path d="m4.9 19.1 2.1-2.1"/><path d="m17 7 2.1-2.1"/>',
  grid:'<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>',
  list:'<path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/>',
  play:'<polygon points="6 3 20 12 6 21 6 3"/>',
  chevL:'<path d="m15 18-6-6 6-6"/>',
  eye:'<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>',
  logo:'<path d="M8 6v12m0 0-3.5-3.5M8 18l3.5-3.5M16 18V6m0 0-3.5 3.5M16 6l3.5 3.5"/>',
};
const ic = (n, cls='') => `<svg class="i ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

// ---------- helpers ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(n){ if(n==null||n<0) return '—'; const u=['B','KB','MB','GB','TB']; let i=0; while(n>=1024&&i<u.length-1){n/=1024;i++} return (i?n.toFixed(n<10?1:0):n)+' '+u[i]; }
function fmtDur(sec){ if(!isFinite(sec)||sec<=0) return ''; sec=Math.round(sec); if(sec<60) return sec+' s'; const m=Math.round(sec/60); if(m<60) return m+' min'; return Math.floor(m/60)+' h '+(m%60)+' min'; }
const rateTxt = r => r>0 ? fmt(r)+'/s' : '';
function ago(d){ const t=new Date(d); if(isNaN(t)||t.getFullYear()<2000) return ''; return t.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); }
function hue(s){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))%360; return h; }
function initials(n){ const p=String(n||'?').split(/[\s\-_.]+/).filter(Boolean); return ((p[0]||'?')[0]+(p[1]?p[1][0]:(p[0]||'')[1]||'')).toUpperCase(); }
const AV=['linear-gradient(135deg,#0d9488,#0891b2)','linear-gradient(135deg,#7c3aed,#c026d3)','linear-gradient(135deg,#ea580c,#e11d48)','linear-gradient(135deg,#2563eb,#0891b2)','linear-gradient(135deg,#16a34a,#0d9488)','linear-gradient(135deg,#db2777,#9333ea)','linear-gradient(135deg,#ca8a04,#ea580c)','linear-gradient(135deg,#475569,#1e293b)'];
const avBg = fp => AV[hue(fp)%AV.length];
const avBucket = () => Math.floor(Date.now()/300000);
const peerAvURL = fp => `/api/peer/avatar?peer=${encodeURIComponent(fp)}&t=${encodeURIComponent(T)}&v=${avBucket()}`;
const avImg = src => `<img class="av-img" alt="" src="${src}" onerror="this.remove()">`;
const avatar = (p, big) => `<span class="avatar" style="background:${avBg(p.fp)}">${esc(initials(p.name))}${p.trusted?avImg(peerAvURL(p.fp)):''}${big?'':`<span class="st ${p.online?'on':''}"></span>`}</span>`;
const selfAvatar = (cls='') => { const m=S.self; return `<span class="avatar ${cls}" style="background:${avBg(m.fp)}">${esc(initials(m.name))}${m.avatar?avImg(`/api/avatar?t=${encodeURIComponent(T)}&v=${m.avatar}`):''}</span>`; };
function kindIcon(name){
  const e=(name.split('.').pop()||'').toLowerCase();
  if(/^(jpe?g|png|gif|webp|bmp|heic|svg|tiff?|raw|avif)$/.test(e)) return 'image';
  if(/^(mp4|mkv|mov|avi|webm|m4v|wmv|flv)$/.test(e)) return 'video';
  if(/^(mp3|wav|flac|aac|ogg|m4a|opus)$/.test(e)) return 'music';
  if(/^(zip|rar|7z|tar|gz|bz2|xz|iso|exe|msi|deb|rpm|apk|dmg)$/.test(e)) return 'archive';
  if(/^(pdf|docx?|xlsx?|pptx?|txt|md|csv|odt|rtf)$/.test(e)) return 'doc';
  return 'file';
}
function setHTML(el, html){ if(el && el._h !== html){ el.innerHTML = html; el._h = html; } }

async function api(path, opts={}){
  const r = await fetch(path, {...opts, headers:{'X-Token':T, ...(opts.headers||{})}});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const post = (p, body) => api(p, {method:'POST', body:JSON.stringify(body||{}), headers:{'Content-Type':'application/json'}});

function toast(msg, kind=''){
  const el=document.createElement('div'); el.className='toast '+kind;
  el.innerHTML = (kind==='err'?ic('alert'):ic('check'))+`<div>${esc(msg)}</div>`;
  $('#toasts').append(el); setTimeout(()=>el.remove(), kind==='err'?7000:4000);
}

// Promise-based confirm dialog that matches the app's look.
function ask({title, text, ok='Confirm', danger=false, icon='alert'}){
  return new Promise(res=>{
    ui.dialog = {html:`<div class="modal" data-act="dlg-bg"><div class="dialog" role="dialog" aria-modal="true">
      <div class="ico" ${danger?'style="background:var(--danger-soft);color:var(--danger)"':''}>${ic(icon,'i-lg')}</div>
      <h2>${esc(title)}</h2><p>${esc(text)}</p>
      <div class="acts"><button class="btn" data-act="dlg-no">Cancel</button><button class="btn ${danger?'danger-solid':'primary'}" data-act="dlg-yes">${esc(ok)}</button></div></div></div>`, res};
    renderModal();
  });
}

// ---------- state ----------
let S = null, firstLoad = true, stopped = false;
const seenDone = new Set();
const ui = {
  view:'device', sel:null, tab:'files', dialog:null, addip:false,
  browse:{fp:null, shares:null, share:null, path:'', items:null, error:null, loading:false},
  upload:null, viewer:null,
  layout:(()=>{ try{ return localStorage.getItem('wd-layout')||'list'; }catch{ return 'list'; } })(),
};
const peerByFP = fp => (S?.peers||[]).find(p=>p.fp===fp);
const trusted = () => (S?.peers||[]).filter(p=>p.trusted).sort((a,b)=>(b.online-a.online)||a.name.localeCompare(b.name));
const nearby = () => (S?.peers||[]).filter(p=>!p.trusted).sort((a,b)=>a.name.localeCompare(b.name));

async function refresh(){
  if(stopped) return;
  try { S = await api('/api/state'); }
  catch(e){ setHTML($('#me'), `<span class="dot"></span><span>Not connected</span>`); return; }
  if(!ui.sel || !peerByFP(ui.sel)){ const t=trusted()[0] || nearby()[0]; ui.sel = t ? t.fp : null; if(ui.view==='device') renderMain(); }
  notifyReceived();
  renderTop(); renderSide(); renderModal(); renderLive();
  if(firstLoad){ firstLoad=false; renderMain(); }
}

function notifyReceived(){
  for(const t of S.transfers){
    if(!t.finished) continue;
    if(seenDone.has(t.id)) continue;
    seenDone.add(t.id);
    if(!firstLoad && t.kind==='receive' && !t.error) toast(`Received ${t.name} from ${t.peer}`);
  }
}

// ---------- top bar & sidebar ----------
function renderTop(){
  const m=S.self;
  setHTML($('#me'), `${m.avatar?selfAvatar():'<span class="dot on"></span>'}<b>${esc(m.name)}</b><span class="addr">${esc((m.addrs[0]||'')+(m.addrs[0]?':'+m.port:''))}</span>`);
  const u=S.update; let h='';
  if(u.installing) h=`<span class="badge accent">${ic('refresh')} Updating…</span>`;
  else if(u.available) h=`<button class="btn sm primary" data-act="update">${ic('sparkle')} Update to ${esc(u.latest)}</button>`;
  else h=`<span class="badge ver" title="Wharfdrop version">${esc(u.current)}</span>`;
  setHTML($('#updpill'), h);
}

function renderSide(){
  const tr=trusted(), nb=nearby();
  setHTML($('#devlist'), tr.length ? tr.map(p=>`
    <button class="dev ${ui.view==='device'&&ui.sel===p.fp?'sel':''}" data-act="select" data-fp="${p.fp}">
      ${avatar(p)}<span class="meta"><span class="name ellipsis">${esc(p.name)}</span><span class="sub ellipsis">${p.online?'Online':'Offline'} · paired</span></span>
    </button>`).join('') : `<div class="side-empty">No paired devices yet.</div>`);
  setHTML($('#nearby'), nb.length ? `<div class="side-h" style="margin-top:14px">Nearby</div>` + nb.map(p=>`
    <button class="dev ${ui.view==='device'&&ui.sel===p.fp?'sel':''}" data-act="select" data-fp="${p.fp}">
      ${avatar(p)}<span class="meta"><span class="name ellipsis">${esc(p.name)}</span><span class="sub ellipsis">${esc(p.addr)}</span></span>
      <span class="badge accent">Pair</span>
    </button>`).join('') : (tr.length ? '' : `<div class="side-empty" style="padding-top:0">${ic('wifi')} Looking for devices on this network…</div>`));
  const active=S.transfers.filter(t=>!t.finished);
  let pct=0; if(active.length){ const d=active.reduce((a,t)=>a+t.done,0), s=active.reduce((a,t)=>a+(t.size>0?t.size:t.done),0); pct=s?d*100/s:0; }
  const nav=(v,icon,label,extra='')=>`<button class="${ui.view===v?'sel':''}" data-act="view" data-v="${v}">${ic(icon)}${label}${extra}</button>`;
  setHTML($('#nav'),
    nav('transfers','arrows','Transfers', active.length?`<span class="badge accent count">${active.length}</span>`:'') +
    (active.length?`<div class="mini-progress"><i style="width:${pct.toFixed(1)}%"></i></div><div class="mini-speed">${speedSummary(active)}</div>`:'') +
    nav('shares','share','Shared folders', S.shares.length?`<span class="badge count">${S.shares.length}</span>`:'') +
    nav('settings','sliders','Settings', S.update.available?`<span class="badge warn count">1</span>`:''));
}

function speedSummary(active){
  const up=active.filter(t=>t.kind==='send').reduce((a,t)=>a+(t.rate||0),0), down=active.filter(t=>t.kind!=='send').reduce((a,t)=>a+(t.rate||0),0);
  const parts=[]; if(up>0) parts.push(`${ic('upload')} ${rateTxt(up)}`); if(down>0) parts.push(`${ic('download')} ${rateTxt(down)}`);
  return parts.join('<span class="faint">·</span>') || 'Starting…';
}

// ---------- main views ----------
function renderMain(){
  const el=$('#main');
  if(!S){ el.innerHTML=''; return; }
  if(ui.view==='transfers') el.innerHTML = viewTransfers();
  else if(ui.view==='shares') el.innerHTML = viewShares();
  else if(ui.view==='settings') el.innerHTML = viewSettings();
  else el.innerHTML = viewDevice();
  el._h=null;
  renderSide(); renderLive();
  if(ui.view==='device'){ const p=peerByFP(ui.sel); if(p&&p.trusted&&ui.tab==='files'&&ui.browse.fp!==p.fp) loadShares(); }
}

function viewDevice(){
  const p=peerByFP(ui.sel);
  if(!p){
    return `<div class="page"><div class="empty" style="padding-top:12vh">
      <div class="big">${ic('wifi','i-lg')}</div><h3>No devices yet</h3>
      <p>Start Wharfdrop on another computer connected to the same Wi-Fi or network. It appears on the left within a few seconds.</p>
      <p class="faint">Not showing up? Your router may isolate devices, or a firewall may block UDP port 47070.</p>
      <div style="margin-top:10px"><button class="btn" data-act="addip">${ic('plus')} Add by IP address</button></div></div></div>`;
  }
  if(!p.trusted){
    return `<div class="page"><div class="empty" style="padding-top:10vh">

function viewBrowse(p){
  const b=ui.browse;
  const head = `<div class="card-h">${b.share?`<button class="btn ghost icon sm up-btn" data-act="up" title="Up one folder">${ic('chevL')}</button>`:''}<div class="crumbs" id="crumbs">${crumbs(p)}</div>
     ${b.share?`<div class="vtoggle" role="group" aria-label="View"><button class="${ui.layout==='list'?'sel':''}" data-act="layout" data-v="list" title="List view">${ic('list')}</button><button class="${ui.layout==='grid'?'sel':''}" data-act="layout" data-v="grid" title="Grid view">${ic('grid')}</button></div>
       <a class="btn sm" href="${dlURL(b.path)}" download title="Download this folder as a zip file">${ic('download')}<span class="hide-sm">Download folder</span></a>`:''}
     <button class="btn ghost icon sm" data-act="reload" title="Refresh">${ic('refresh')}</button></div>`;
  let body;
  if(b.error) body=`<div class="empty"><div class="big">${ic('alert','i-lg')}</div><h3>Could not load</h3><p>${esc(b.error)}</p></div>`;
  else if(b.loading || (!b.share && b.shares==null)) body=`<div class="empty"><p>Loading…</p></div>`;
  else if(!b.share){
    body = b.shares.length ? `<div class="share-grid">${b.shares.map((s,i)=>`
        <button class="share-tile" data-act="open-share" data-i="${i}"><span class="ficon folder">${ic('folder','i-lg')}</span>
          <span class="ellipsis"><b class="ellipsis" style="display:block">${esc(s.name)}</b><span class="muted" style="font-size:13px">Shared folder · read-only</span></span></button>`).join('')}</div>`
      : `<div class="empty"><div class="big">${ic('folder','i-lg')}</div><h3>Nothing shared with you yet</h3>
         <p>On ${esc(p.name)}, open <b>Shared folders</b> and add a folder. It will show up here to browse and download.</p></div>`;
  } else {
    const items=b.items||[];
    const rel = e => (b.path?b.path+'/':'')+e.name;

        if(e.dir) return `<button class="gtile" data-act="open-dir" data-i="${i}" title="${esc(e.name)}"><span class="gthumb folder">${ic('folder')}</span><span class="gname ellipsis">${esc(e.name)}</span><span class="gmeta">Folder</span></button>`;
        const k=previewKind(e.name);
        const thumb = k==='image' ? `<img loading="lazy" decoding="async" alt="" src="${thumbURL(rel(e))}" onerror="this.remove()">` : '';
        return `<button class="gtile" data-act="preview" data-i="${i}" title="${esc(e.name)}"><span class="gthumb">${ic(kindIcon(e.name))}${thumb}${k==='video'?`<span class="play">${ic('play')}</span>`:''}</span><span class="gname ellipsis">${esc(e.name)}</span><span class="gmeta">${fmt(e.size)}</span></button>`;
      }).join('')}</div>`;
    } else
    body = items.length ? `<div class="rows"><div class="row head"><span></span><span>Name</span><span class="num">Size</span><span class="date">Modified</span><span></span></div>${items.map((e,i)=>{
        const p2=rel(e);
        return e.dir
          ? `<div class="row click" data-act="open-dir" data-i="${i}" title="${esc(e.name)}"><span class="ficon folder">${ic('folder')}</span><span class="ellipsis" style="font-weight:550">${esc(e.name)}</span><span class="num"></span><span class="num date">${ago(e.mtime)}</span><span class="act">${ic('chev')}</span></div>`
          : `<div class="row file" data-act="preview" data-i="${i}" title="Preview ${esc(e.name)}"><span class="ficon">${ic(kindIcon(e.name))}</span><span class="ellipsis">${esc(e.name)}</span><span class="num">${fmt(e.size)}</span><span class="num date">${ago(e.mtime)}</span><span class="act"><a class="btn ghost icon sm" href="${dlURL(p2)}" download title="Download">${ic('download')}</a></span></div>`;
      }).join('')}</div>`

}

function crumbs(p){
  const b=ui.browse;
  let h=`<button data-act="crumb" data-depth="-1">${esc(p.name)}</button>`;
  if(b.share){
    h+=`<span class="sep">${ic('chev')}</span><button data-act="crumb" data-depth="0">${esc(b.share)}</button>`;
    (b.path?b.path.split('/'):[]).forEach((seg,i)=>{ h+=`<span class="sep">${ic('chev')}</span><button data-act="crumb" data-depth="${i+1}">${esc(seg)}</button>`; });
  }
  return h;
}
const dlURL = path => `/api/peer/get?peer=${encodeURIComponent(ui.browse.fp)}&share=${encodeURIComponent(ui.browse.share)}&path=${encodeURIComponent(path)}&t=${encodeURIComponent(T)}`;
const viewURL = path => dlURL(path)+'&inline=1';
const thumbURL = path => dlURL(path)+'&thumb=360';
function previewKind(name){
  const e=(name.split('.').pop()||'').toLowerCase();
  if(/^(jpe?g|png|gif|webp|bmp|avif|ico)$/.test(e)) return 'image';
  if(/^(mp4|m4v|webm|mov|mkv|ogv)$/.test(e)) return 'video';
  if(/^(mp3|m4a|aac|wav|ogg|oga|opus|flac)$/.test(e)) return 'audio';
  if(e==='pdf') return 'pdf';
  if(/^(txt|md|markdown|csv|tsv|json|log|xml|ya?ml|ini|conf|cfg|toml|go|py|js|mjs|ts|tsx|jsx|html?|css|scss|sh|bash|ps1|bat|c|h|cpp|hpp|cs|java|kt|rs|rb|php|sql|swift|env|gitignore|srt|vtt)$/.test(e)) return 'text';
  return 'none';
}

// ---------- preview viewer ----------
function viewerFiles(){ return (ui.browse.items||[]).map((e,i)=>({e,i})).filter(x=>!x.e.dir); }
async function renderViewer(){
  const el=$('#viewer'); const v=ui.viewer;
  if(!v){ el.innerHTML=''; document.body.style.overflow=''; return; }
  const files=viewerFiles(); const pos=files.findIndex(x=>x.i===v.i); const e=ui.browse.items[v.i];
  const rel=(ui.browse.path?ui.browse.path+'/':'')+e.name, k=previewKind(e.name), src=viewURL(rel);
  let media;
  if(k==='image') media=`<img src="${src}" alt="${esc(e.name)}">`;
  else if(k==='video') media=`<video src="${src}" controls autoplay playsinline onerror="vFail()"></video>`;
  else if(k==='audio') media=`<div class="vnone"><div class="big">${ic('music','i-lg')}</div><h3>${esc(e.name)}</h3><audio src="${src}" controls autoplay onerror="vFail()"></audio></div>`;
  else if(k==='pdf') media=`<iframe src="${src}#view=FitH" title="${esc(e.name)}"></iframe>`;
  else if(k==='text') media=`<pre id="vtext">Loading…</pre>`;
  else media=`<div class="vnone"><div class="big">${ic(kindIcon(e.name),'i-lg')}</div><h3>No preview for this file type</h3><p>Download it to open it on this computer.</p><a class="btn primary" href="${dlURL(rel)}" download>${ic('download')} Download ${fmt(e.size)}</a></div>`;
  el.innerHTML = `<div class="viewer" role="dialog" aria-modal="true" aria-label="Preview">
    <div class="vbar"><div class="vname ellipsis" title="${esc(e.name)}">${esc(e.name)}</div>
      <span class="vmeta">${fmt(e.size)} · ${pos+1} of ${files.length}</span>
      <a class="btn sm" href="${dlURL(rel)}" download>${ic('download')}<span class="hide-sm">Download</span></a>
      <button class="btn icon sm" data-act="vclose" title="Close (Esc)">${ic('x')}</button></div>
    <div class="vstage"><button class="vnav" data-act="vstep" data-d="-1" ${pos<=0?'disabled':''} title="Previous (←)">${ic('chevL')}</button>
      <div class="vmedia" id="vmedia">${media}</div>
      <button class="vnav" data-act="vstep" data-d="1" ${pos>=files.length-1?'disabled':''} title="Next (→)">${ic('chev')}</button></div></div>`;
  document.body.style.overflow='hidden';
  if(k==='text'){
    try{ const r=await fetch(src,{headers:{Range:'bytes=0-262143'}}); let t=await r.text(); if(e.size>262144) t+='\n\n… preview shows the first 256 KB. Download the file to see all of it.'; const pre=$('#vtext'); if(pre&&ui.viewer===v) pre.textContent=t; }
    catch(err){ const pre=$('#vtext'); if(pre) pre.textContent='Could not load preview: '+err.message; }
  }
}
window.vFail = () => { const m=$('#vmedia'); const e=ui.viewer&&ui.browse.items[ui.viewer.i]; if(!m||!e) return;
  const rel=(ui.browse.path?ui.browse.path+'/':'')+e.name;
  m.innerHTML=`<div class="vnone"><div class="big">${ic('alert','i-lg')}</div><h3>This format can't play in the browser</h3><p>Download it and open it with a media player such as VLC.</p><a class="btn primary" href="${dlURL(rel)}" download>${ic('download')} Download ${fmt(e.size)}</a></div>`; };
function vStep(d){ const f=viewerFiles(); const pos=f.findIndex(x=>x.i===ui.viewer.i)+d; if(pos>=0&&pos<f.length){ ui.viewer={i:f[pos].i}; renderViewer(); } }

async function loadShares(){
  const fp=ui.sel; Object.assign(ui.browse,{fp, shares:null, share:null, path:'', items:null, error:null, loading:true}); rerenderTab();
  try{ const s=await api('/api/peer/shares?peer='+encodeURIComponent(fp)); if(ui.browse.fp!==fp) return; ui.browse.shares=s; }
  catch(e){ if(ui.browse.fp===fp) ui.browse.error=e.message; }
  ui.browse.loading=false; rerenderTab();
}
async function loadDir(){
  ui.viewer=null; renderViewer();
  const b=ui.browse, key=b.fp+'|'+b.share+'|'+b.path; b.loading=true; b.error=null; rerenderTab();
  try{
    const items=await api(`/api/peer/ls?peer=${encodeURIComponent(b.fp)}&share=${encodeURIComponent(b.share)}&path=${encodeURIComponent(b.path)}`);
    if(key!==b.fp+'|'+b.share+'|'+b.path) return;
    items.sort((x,y)=>(y.dir-x.dir)||x.name.localeCompare(y.name,undefined,{numeric:true,sensitivity:'base'}));
    b.items=items;
  }catch(e){ b.error=e.message; }
  b.loading=false; rerenderTab();
}
function rerenderTab(){ const tb=$('#tabbody'); const p=peerByFP(ui.sel); if(tb&&p&&ui.tab==='files') tb.innerHTML=viewBrowse(p); }

function trRow(t){
  const pct = t.size>0 ? Math.min(100, t.done*100/t.size) : (t.finished&&!t.error?100:35);
  const incoming = t.kind!=='send';
  const live = [rateTxt(t.rate||t.avg), t.eta?fmtDur(t.eta)+' left':''].filter(Boolean).join(' · ');
  const status = t.error ? `<span style="color:var(--danger)">Failed</span>` : (t.finished ? `Done${t.avg>0&&t.done>1048576?` · ${rateTxt(t.avg)} avg`:''}` : `<b class="live">${live||'Starting…'}</b>`);
  const verb = {send:'Sent to', receive:'Received from', download:'Downloaded from'}[t.kind] || '';
  return `<div class="tr">
    <span class="dir ${t.error?'err':(incoming?'in':'out')}">${ic(t.error?'alert':(incoming?'download':'upload'))}</span>
    <div style="min-width:0"><div class="nm ellipsis" title="${esc(t.name)}">${esc(t.name)}</div>
      <div class="info ellipsis" title="${esc(t.error||t.dest||'')}">${verb} ${esc(t.peer)}${t.error?' · '+esc(t.error):''}</div>
      ${t.finished&&!t.error?'':`<div class="bar"><i class="${t.error?'err':''}" style="width:${pct.toFixed(1)}%"></i></div>`}</div>
    <div class="right"><span>${fmt(t.done)}${t.size>0&&!t.finished?' / '+fmt(t.size):''}</span><span>·</span><span>${status}</span>
      ${t.kind==='receive'&&t.finished&&!t.error?`<button class="btn ghost icon sm" data-act="open-incoming" title="Open the Wharfdrop folder">${ic('folderOpen')}</button>`:''}</div>
  </div>`;
}

      : `<div class="empty"><div class="big">${ic('share','i-lg')}</div><h3>No shared folders</h3><p>Add a folder above. Paired devices will see it under <b>Files</b>.</p></div>`); }

    setHTML(m, `<div class="modal" data-act="addip-bg"><div class="dialog" role="dialog" aria-modal="true"><div class="ico">${ic('wifi','i-lg')}</div>
      <h2>Add a device by IP address</h2><p>Use this if a device does not appear automatically. Its address is shown at the top of Wharfdrop on that device.</p>
      <form id="ipform" style="margin-top:16px"><input class="input mono" name="addr" placeholder="192.168.1.20" autofocus required>
      <div class="acts"><button type="button" class="btn" data-act="addip-close">Cancel</button><button class="btn primary">Pair</button></div></form></div></div>`);
    setTimeout(()=>$('#ipform input')?.focus(), 0);
  } else setHTML(m, '');
}

// ---------- sending ----------
function sendTarget(){ const p=peerByFP(ui.sel); return ui.view==='device'&&p&&p.trusted ? p : null; }
async function collect(dt){
  const out=[], entries=[...(dt.items||[])].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  if(!entries.length){ for(const f of dt.files) out.push({file:f, rel:f.name}); return out; }
  const readAll = r => new Promise(res=>{ const all=[]; const step=()=>r.readEntries(es=>{ if(!es.length) res(all); else { all.push(...es); step(); } }); step(); });
  const walk = async (e, prefix) => {
    if(e.isFile) await new Promise(res=>e.file(f=>{ out.push({file:f, rel:prefix+e.name}); res(); }, res));
    else for(const c of await readAll(e.createReader())) await walk(c, prefix+e.name+'/');
  };
  for(const e of entries) await walk(e,'');
  return out;
}
const PARALLEL_MIN = 24<<20;   // files at least this big go in parallel chunks
let uploadXHRs = new Set(), uploadCancelled = false;

function xhrSend(method, url, body, onProgress){
  return new Promise((resolve, reject)=>{
    const x=new XMLHttpRequest(); uploadXHRs.add(x);
    x.open(method, url); x.setRequestHeader('X-Token', T);
    if(onProgress) x.upload.onprogress=e=>onProgress(e.loaded);
    x.onload=()=>{ uploadXHRs.delete(x); if(x.status>=200&&x.status<300) resolve(x.responseText); else { let m=x.statusText; try{ m=JSON.parse(x.responseText).error||m }catch{} const err=new Error(m); err.status=x.status; reject(err); } };
    x.onerror=()=>{ uploadXHRs.delete(x); reject(new Error('connection lost')); };
    x.onabort=()=>{ uploadXHRs.delete(x); reject(new Error('cancelled')); };
    x.send(body);
  });
}

function trackRate(){
  const u=ui.upload; if(!u) return; const now=performance.now();
  if(!u.sampleAt){ u.sampleAt=now; u.sampleLoaded=u.loaded; return; }
  const dt=(now-u.sampleAt)/1000; if(dt<0.4) return;
  const inst=(u.loaded-u.sampleLoaded)/dt; u.rate = u.rate ? 0.55*inst+0.45*u.rate : inst;
  u.sampleAt=now; u.sampleLoaded=u.loaded;
}

// Sends one big file as parallel 8 MB chunks. Returns false if the other
// device is an older version without chunked uploads.
async function sendChunked(p, file, rel, base){
  let st;
  try{ st=JSON.parse(await xhrSend('POST','/api/send/start', JSON.stringify({peer:p.fp, name:rel, size:file.size}))); }
  catch(e){ if(e.status===409) return false; throw e; }
  const chunk=st.chunk, streams=st.streams||4, perChunk=new Map(); let next=0, failed=null;
  const report=()=>{ let sum=0; for(const v of perChunk.values()) sum+=v; ui.upload.loaded=base+sum; trackRate(); renderLive(); };
  const worker=async()=>{
    while(!failed && !uploadCancelled){
      const off=next; if(off>=file.size) return; next+=chunk;
      const blob=file.slice(off, Math.min(off+chunk, file.size));
      for(let attempt=0;;attempt++){
        try{ await xhrSend('PUT', `/api/send/chunk?id=${st.id}&off=${off}`, blob, n=>{ perChunk.set(off,n); report(); }); perChunk.set(off, blob.size); report(); break; }
        catch(e){ perChunk.set(off,0); if(uploadCancelled||attempt>=2){ failed=e; return; } await new Promise(r=>setTimeout(r,400*(attempt+1))); }
      }
    }
  };
  await Promise.all(Array.from({length:streams}, worker));
  if(failed||uploadCancelled){ try{ await xhrSend('POST',`/api/send/finish?id=${st.id}&abort=1`,null); }catch{} throw failed||new Error('cancelled'); }
  await xhrSend('POST',`/api/send/finish?id=${st.id}`,null);
  return true;
}

async function send(files){
  const p=sendTarget(); if(!p){ toast('Select a paired device first.','err'); return; }
  if(!files.length) return;
  if(ui.upload){ toast('Please wait for the current send to finish.','err'); return; }
  const total=files.reduce((a,f)=>a+f.file.size,0);
  ui.upload={peer:p.name, count:files.length, loaded:0, total, rate:0}; uploadCancelled=false; renderLive();
  const big=files.filter(f=>f.file.size>=PARALLEL_MIN), small=files.filter(f=>f.file.size<PARALLEL_MIN);
  let done=0;
  try{
    for(const {file,rel} of big){
      ui.upload.current=rel;
      const ok=await sendChunked(p, file, rel, done);
      if(!ok) small.push({file,rel}); else done+=file.size;
    }
    if(small.length && !uploadCancelled){
      ui.upload.current = small.length===1 ? small[0].rel : `${small.length} smaller files`;
      const fd=new FormData(); for(const {file,rel} of small) fd.append('file', file, rel);
      const smallTotal=small.reduce((a,f)=>a+f.file.size,0), base=done;
      await xhrSend('POST','/api/send?peer='+encodeURIComponent(p.fp), fd, n=>{ ui.upload.loaded=base+Math.min(n,smallTotal); trackRate(); renderLive(); });
    }
    toast(`Sent ${files.length} item${files.length>1?'s':''} to ${p.name}`);
  }catch(e){ toast(uploadCancelled?'Send cancelled':'Send failed: '+e.message, uploadCancelled?'':'err'); }
  ui.upload=null; renderLive(); refresh();
}
$('#avin').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return;
  if(f.size>20<<20){ toast('Please choose a picture under 20 MB.','err'); return; }
  try{ await api('/api/avatar',{method:'POST', body:f}); await refresh(); renderMain(); toast('Profile picture updated'); }catch(err){ toast(err.message,'err'); } };
$('#fi').onchange=e=>{ send([...e.target.files].map(f=>({file:f, rel:f.name}))); e.target.value=''; };
$('#di').onchange=e=>{ send([...e.target.files].map(f=>({file:f, rel:f.webkitRelativePath||f.name}))); e.target.value=''; };

let dragDepth=0;
window.addEventListener('dragenter', e=>{ if(![...(e.dataTransfer?.types||[])].includes('Files')) return; e.preventDefault(); dragDepth++;
  const p=sendTarget(); $('#overlaytext').innerHTML = p ? `${ic('upload','i-lg')} Drop to send to ${esc(p.name)}` : `${ic('alert','i-lg')} Select a paired device first`;
  $('#overlay').classList.add('on'); $('#drop')?.classList.add('over'); });
window.addEventListener('dragover', e=>{ if([...(e.dataTransfer?.types||[])].includes('Files')) e.preventDefault(); });
window.addEventListener('dragleave', e=>{ if(--dragDepth<=0){ dragDepth=0; $('#overlay').classList.remove('on'); $('#drop')?.classList.remove('over'); } });
window.addEventListener('drop', async e=>{ e.preventDefault(); dragDepth=0; $('#overlay').classList.remove('on'); $('#drop')?.classList.remove('over');
  if(!sendTarget()){ toast('Select a paired device first.','err'); return; } send(await collect(e.dataTransfer)); });

// ---------- actions ----------
const ACT = {
  select: d => { ui.view='device'; ui.sel=d.fp; ui.tab='files'; ui.browse.fp=null; renderMain(); },
  view: d => { ui.view=d.v; renderMain(); },
  tab: d => { ui.tab=d.tab; const p=peerByFP(ui.sel); if(d.tab==='files'&&ui.browse.fp!==ui.sel) { renderMain(); } else { $('#main').innerHTML=viewDevice(); renderLive(); } },
  'open-share': d => { const b=ui.browse; b.share=b.shares[+d.i].name; b.path=''; b.items=null; loadDir(); },
  'open-dir': d => { const b=ui.browse; b.path=(b.path?b.path+'/':'')+b.items[+d.i].name; loadDir(); },
  crumb: d => { const b=ui.browse, k=+d.depth; if(k<0){ b.share=null; b.path=''; b.items=null; b.error=null; if(b.shares==null) loadShares(); else rerenderTab(); return; }
    b.path=(b.path?b.path.split('/'):[]).slice(0,k).join('/'); loadDir(); },
  layout: d => { ui.layout=d.v; try{ localStorage.setItem('wd-layout', d.v); }catch{} rerenderTab(); },
  preview: (d,e) => { if(e.target.closest('a')) return; ui.viewer={i:+d.i}; renderViewer(); },
  vclose: () => { ui.viewer=null; renderViewer(); },
  vstep: d => vStep(+d.d),
  up: () => { const b=ui.browse; const parts=b.path?b.path.split('/'):[]; ACT.crumb({depth: String(parts.length ? parts.length-1 : -1)}); },
  'cancel-upload': () => { uploadCancelled=true; for(const x of uploadXHRs) x.abort(); },
  'pick-avatar': () => $('#avin').click(),
  'remove-avatar': async () => { await api('/api/avatar',{method:'DELETE'}); await refresh(); renderMain(); toast('Profile picture removed'); },
  reload: () => { if(ui.browse.share) loadDir(); else loadShares(); },
  'pick-files': () => $('#fi').click(),
  'pick-folder': () => $('#di').click(),
  pair: async d => { try{ await post('/api/pair',{fp:d.fp}); refresh(); }catch(e){ toast('Pairing failed: '+e.message,'err'); } },
  pconfirm: async d => { await post('/api/pair/confirm',{id:d.id}); refresh(); },
  pcancel: async d => { await post('/api/pair/cancel',{id:d.id}); refresh(); },
  respond: async d => { await post('/api/pair/respond',{id:d.id, allow:d.allow==='1'}); if(d.allow==='1') toast('Paired'); refresh(); },
  unpair: async d => { const p=peerByFP(d.fp);
    if(!await ask({title:`Unpair ${p?.name||'device'}?`, text:'It will no longer be able to send you files or browse your shared folders until you pair again.', ok:'Unpair', danger:true})) return;
    await post('/api/unpair',{fp:d.fp}); ui.browse.fp=null; await refresh(); renderMain(); },
  unshare: async d => { const s=S.shares[+d.i];
    if(!await ask({title:`Stop sharing “${s.name}”?`, text:'Paired devices will no longer see this folder. Nothing on disk is deleted.', ok:'Stop sharing', danger:true})) return;
    await api('/api/shares?name='+encodeURIComponent(s.name),{method:'DELETE'}); refresh(); },
  addip: () => { ui.addip=true; renderModal(); },
  'addip-close': () => { ui.addip=false; renderModal(); },
  'addip-bg': (d,e) => { if(e.target.classList.contains('modal')){ ui.addip=false; renderModal(); } },
  'dlg-yes': () => { const r=ui.dialog.res; ui.dialog=null; renderModal(); r(true); },
  'dlg-no': () => { const r=ui.dialog.res; ui.dialog=null; renderModal(); r(false); },
  'dlg-bg': (d,e) => { if(e.target.classList.contains('modal')) ACT['dlg-no'](); },
  'open-incoming': async () => { try{ await post('/api/open-folder',{which:'incoming'}); }catch(e){ toast(e.message,'err'); } },
  umode: async d => { await post('/api/settings',{auto_update:d.v}); await refresh(); },
  ucheck: async () => { try{ const u=await post('/api/update/check'); toast(u.error?'Update check failed: '+u.error : u.available?`${u.latest} is available`:`You're up to date (${u.current})`, u.error?'err':''); }catch(e){ toast(e.message,'err'); } refresh(); },
  update: async () => { if(!await ask({title:`Install ${S.update.latest}?`, text:'Wharfdrop downloads and verifies the update, then restarts. It takes a few seconds.', ok:'Update', icon:'sparkle'})) return;
    try{ await post('/api/update/install'); toast('Update installed. Restarting…'); setTimeout(()=>location.reload(), 4000); }catch(e){ toast(e.message,'err'); } },
  stop: async () => {
    if(!await ask({title:'Stop Wharfdrop?', text:'Other devices will not see this computer until you start Wharfdrop again. It uses no resources while stopped.', ok:'Stop', danger:true, icon:'x'})) return;
    try{ await post('/api/shutdown'); }
    catch(e){ if(!await ask({title:'A transfer is in progress', text:'Stopping now cancels it. Stop anyway?', ok:'Stop anyway', danger:true})) return; await post('/api/shutdown?force=1'); }
    stopped=true;
    document.body.innerHTML = `<div class="stopped"><div class="empty"><div class="big">${ic('check','i-lg')}</div><h3>Wharfdrop is stopped</h3>
      <p>It is not running and uses no resources. Start it again from the Start menu or with <span class="mono">wharfdrop ui</span>, then reload this page.</p></div></div>`;
  },
};
document.addEventListener('click', e=>{
  const a=e.target.closest('[data-act]'); if(!a) return;
  if(a.tagName==='A' || e.target.closest('a[download]')) return; // plain download links
  e.preventDefault(); ACT[a.dataset.act]?.(a.dataset, e);
});
document.addEventListener('keydown', e=>{ if(ui.viewer){ if(e.key==='Escape'){ ACT.vclose(); return; } if(e.key==='ArrowRight'){ vStep(1); return; } if(e.key==='ArrowLeft'){ vStep(-1); return; } } if(e.key==='Escape'){ if(ui.dialog) ACT['dlg-no'](); else if(ui.addip){ ui.addip=false; renderModal(); } } });
document.addEventListener('submit', async e=>{
  e.preventDefault(); const f=e.target, fd=new FormData(f);
  if(f.id==='shareform'){
    try{ await post('/api/shares',{name:fd.get('name').trim(), path:fd.get('path').trim(), peers:[fd.get('peer')]}); f.reset(); toast(`Sharing ${fd.get('name').trim()}`); refresh(); }
    catch(err){ toast(err.message,'err'); }
  } else if(f.id==='ipform'){
    let a=fd.get('addr').trim(); if(!a) return; if(!/:\d+$/.test(a)) a+=':48080';
    try{ await post('/api/pair',{addr:a}); ui.addip=false; refresh(); }catch(err){ toast('Pairing failed: '+err.message,'err'); }
  } else if(f.dataset.form){
    try{ await post('/api/settings', {[f.dataset.form]: fd.get('v').trim()}); toast('Saved'); await refresh(); }catch(err){ toast(err.message,'err'); }
  }
});

$('#logo').innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${P.logo}</svg>`;
$('#addbtn').innerHTML = ic('plus');
async function loop(){ await refresh(); const busy = ui.upload || (S && S.transfers.some(t=>!t.finished)); setTimeout(loop, busy ? 700 : 1500); }
loop();
</script>
