name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran or the steps you took.
      placeholder: |
        1. Run ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output, logs or screenshots
      description: Paste any error messages or terminal output. Remove tokens, passwords and other secrets first.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, and versions of relevant tools.
      placeholder: e.g. Ubuntu 26.04, Chrome 140, Node 22
