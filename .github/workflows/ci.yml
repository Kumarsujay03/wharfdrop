name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...

  cross-build:
    name: Cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - run: ./build.sh

  windows-smoke:
    name: Windows smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Build with build.ps1 (no make)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build.ps1 -NoTest
      - name: Start, status, stop, and no-argument launch
        shell: pwsh
        env:
          WHARFDROP_DIR: ${{ runner.temp }}\wd
          WHARFDROP_NO_BROWSER: "1"
        run: |
          $exe = ".\bin\wharfdrop.exe"
          & $exe start;  if ($LASTEXITCODE) { throw "start failed" }
          & $exe status; if ($LASTEXITCODE) { throw "status failed" }
          & $exe stop;   if ($LASTEXITCODE) { throw "stop failed" }
          Start-Sleep 1
          if (Get-Process wharfdrop -ErrorAction SilentlyContinue) { throw "still running after stop" }
          # running with no command (like a double-click) must start it
          & $exe;        if ($LASTEXITCODE) { throw "no-arg launch failed" }
          & $exe status | Select-String "This device" | Out-Null
          if (-not $?) { throw "not running after no-arg launch" }
          & $exe stop
          Start-Sleep 1
          if (Get-Process wharfdrop -ErrorAction SilentlyContinue) { throw "still running after stop" }
          Write-Host "smoke test passed"
      - name: Installer on Windows PowerShell 5.1
        shell: powershell
        env:
          WHARFDROP_NO_LAUNCH: "1"
          WHARFDROP_DIR: ${{ runner.temp }}\wd2
        run: |
          $PSVersionTable.PSVersion
          $out = .\install.ps1 *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'Latest release: (v\d+\.\d+\.\d+)') { throw "installer did not find the latest release" }
          $tag = $Matches[1]
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Wharfdrop\wharfdrop.exe'
          $ver = & $exe version
          if ($ver -ne "wharfdrop $tag") { throw "installed '$ver', expected $tag" }
          if (-not (Test-Path (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Wharfdrop.lnk'))) { throw "no Start menu shortcut" }
          $env:WHARFDROP_UNINSTALL = "1"
          .\install.ps1
          if (Test-Path $exe) { throw "uninstall left the binary" }
          Write-Host "installer test passed on Windows PowerShell 5.1"
      - name: Installer on PowerShell 7
        shell: pwsh
        env:
          WHARFDROP_NO_LAUNCH: "1"
          WHARFDROP_DIR: ${{ runner.temp }}\wd3
        run: |
          $PSVersionTable.PSVersion
          $out = .\install.ps1 *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'Latest release: (v\d+\.\d+\.\d+)') { throw "installer did not find the latest release" }
          $tag = $Matches[1]
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Wharfdrop\wharfdrop.exe'
          $ver = & $exe version
          if ($ver -ne "wharfdrop $tag") { throw "installed '$ver', expected $tag" }
          if (-not (Test-Path (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Wharfdrop.lnk'))) { throw "no Start menu shortcut" }
          $env:WHARFDROP_UNINSTALL = "1"
          .\install.ps1
          if (Test-Path $exe) { throw "uninstall left the binary" }
          Write-Host "installer test passed on PowerShell 7"
